; PlatformIO Project Configuration File
;
; Drive Remote Controller -- three Hat Labs SH-ESP32 firmwares sharing one
; lib/control_core/:
;   env:tx_shesp32  src/tx/  Handheld Controller      (shift switches -> SK)
;   env:rx_shesp32  src/rx/  Motion Controller        (SK/local -> drive servos)
;   env:hh_shesp32  src/hh/  Heading Hold Controller  (BNO086 -> bow thruster)
; Each env builds exactly one src/ subdirectory; the pure core is shared and
; host-tested once, under env:native.
; See ARCHITECTURE.md and SAFETY.md for the design and the safety invariants.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
build_cache_dir = .pio/build_cache
default_envs =
    rx_shesp32
    tx_shesp32
    hh_shesp32

[env]
; Options common for all working environments
;; Uncomment and change these if PlatformIO can't auto-detect the ports
;monitor_port = /dev/tty.usbserial-310
;upload_port = /dev/tty.usbserial-310
upload_speed = 2000000
monitor_speed = 115200
; SensESP, including set_wifi_clients() for multi-SSID support. All three
; firmwares deliberately track ONE source together -- currently the owner's
; fork's fix_analog_input branch, not upstream, so the commented-out upstream
; line below stays as the record of where to return. This dependency is
; intentionally unpinned by the owner's 2026-07-25 decision; do not describe a
; build as reproducible without recording the resolved revision from its log --
; that applies doubly to a branch ref, which moves under you.
lib_deps =
    ; https://github.com/SignalK/SensESP.git
    https://github.com/KEGustafsson/SensESP.git#fix_analog_input
build_flags =
    ; Max (and default) debugging level in Arduino ESP32 Core
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
    ; Use the ESP-IDF logging library - required by SensESP.
    -D USE_ESP_IDF_LOG
; "min_spiffs" has two app partitions (room for OTA updates); SH-ESP32 has
; 4 MB flash so this is the right table for this board.
board_build.partitions = min_spiffs.csv
; Uncomment the following lines to use Over-the-air (OTA) Updates
upload_protocol = espota
; The OTA password is NOT written here. scripts/ota_auth.py reads the one copy
; in include/secrets.h -- the same file enable_ota() compiles it out of -- and
; hands it to the uploader, so the credential lives in exactly one gitignored
; place. See scripts/ota_auth.py and docs/BUILDING.md section 8.
build_unflags =
    -Werror=reorder
monitor_filters = esp32_exception_decoder
test_build_src = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Shared SH-ESP32 board configuration (pioarduino platform fork), extended
; by the tx/rx environments below with their own src filter.

[shesp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32dev
; Injects --auth= and the board's address from include/secrets.h when uploading
; over the air. The address is also set on a plain build, which is what stops the
; platform builder printing "Error: Please specify IP address or host name of ESP
; device" on every single build of an espota env -- a line IDEs show as a build
; error even though the build succeeds. Without a secrets.h it stays quiet and
; does nothing, so CI still builds all three firmwares; inert too on a serial
; flash, where esptool would reject an --auth= flag. Not in [env]: env:native has
; nothing to upload to.
extra_scripts = pre:scripts/ota_auth.py
build_flags =
    ${env.build_flags}
    -D BUTTON_BUILTIN=0
    -D LED_BUILTIN=2
    ; Enable SSL/TLS support for Signal K server connections
    -D SENSESP_SSL_SUPPORT=1
    ; SK WS send buffer (default 1024) -- bumped per heading-hold's
    ; own finding: the first post-connect delta bundles all paths' metadata
    ; and can exceed the default buffer, silently dropping units metadata.
    -D SENSESP_SK_WS_BUFFER_SIZE=4096
lib_deps =
    ${env.lib_deps}
    esp_websocket_client=https://components.espressif.com/api/downloads/?object_type=component&object_id=dbc87006-9a4b-45e6-a6ab-b286174cb413

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; TX firmware -- src/tx/ only. RX-side sources excluded from this build.

[env:tx_shesp32]
; upload_port comes from SECRET_OTA_HOST_TX in include/secrets.h,
; injected by scripts/ota_auth.py. Override with --upload-port.
extends = shesp32_common
build_src_filter = -<*> +<tx/*>

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; RX firmware -- src/rx/ only. TX-side sources excluded from this build.
; Only RX drives servos, so ESP32Servo is added here, not in [env] /
; shesp32_common (TX has no use for it).

[env:rx_shesp32]
; upload_port comes from SECRET_OTA_HOST_RX in include/secrets.h.
extends = shesp32_common
build_src_filter = -<*> +<rx/*>
lib_deps =
    ${shesp32_common.lib_deps}
    ; Pinned to an exact commit -- same rationale as the SensESP pin above.
    https://github.com/KEGustafsson/ESP32Servo#cacf55b0c0e8682f3dde3d23908b4a87b3e6bb69

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Heading Hold firmware -- src/hh/ only. A third, physically separate
; SH-ESP32 (BNO086 over UART-RVC in, bow-thruster ENABLE/PORT/STBD logic
; out). It shares this project's toolchain, include/config.h and pure core,
; but no hardware and no outputs with TX/RX -- see ARCHITECTURE.md.
; No servo library here: HH drives plain GPIOs, not servos.

[env:hh_shesp32]
; upload_port comes from SECRET_OTA_HOST_HH in include/secrets.h.
extends = shesp32_common
build_src_filter = -<*> +<hh/*>

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Host-side unit tests for lib/control_core -- pure C++17, no Arduino.h.
; `pio test -e native` builds each test/test_*/ against lib/control_core
; (common/ + drive/ + heading/) only; src/ (Arduino/SensESP) is excluded
; and never compiled here. One run covers all three firmwares' pure logic.

[env:native]
platform = native
build_flags = -std=c++17
lib_deps =
lib_compat_mode = off
test_build_src = false
build_src_filter = -<*>
test_framework = unity
