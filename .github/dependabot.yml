# Keeps current the three dependency sets this repository can actually track:
# the Android station's Gradle dependencies, the Signal K plugin's npm tree, and
# the GitHub Actions pinned in the workflows. One grouped pull request per
# ecosystem per week at most; review each like any other change.
#
# WHAT DEPENDABOT CANNOT SEE HERE, and it is the most important dependency in
# the project: the firmware's. `esp32/platformio.ini` resolves SensESP from a
# git BRANCH ref (`KEGustafsson/SensESP#fix_analog_input`), ESP32Servo from a
# commit, and the platform from a release zip. Dependabot has no PlatformIO
# ecosystem and would not follow a branch ref if it had one, so that dependency
# moves under every build with nothing watching it. The release workflow records
# the resolved versions in each firmware's SBOM, which is the only place a given
# binary's actual dependencies are written down. See docs/BUILDING.md 3.1.
#
# Gradle and npm majors are taken by hand, with the migration work they need, so
# Dependabot proposes minor and patch updates for those two. GitHub Actions are
# deliberately NOT limited that way: a major bump of an action is usually how a
# security fix arrives, and the workflows pin actions by commit SHA, so an
# unreviewed one cannot slip in regardless.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      all-gradle:
        patterns: ["*"]
    ignore:
      # AGP, Kotlin, Compose and Robolectric majors all carry migration work,
      # and Robolectric's sandbox level is tied to compileSdk (see
      # gradle/libs.versions.toml).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # androidx.core raises its minCompileSdk in MINOR releases, so the rule
      # above does not catch it. Measured from each release's aar-metadata:
      # 1.15/1.16 need compileSdk 35, 1.17/1.18 need 36, 1.19 needs 37 AND
      # AGP 9.1. A bump past 1.16 therefore drags in an AGP major, a compileSdk
      # move, new SDK packages in ci.yml and a new Robolectric sandbox level --
      # which also re-measures the layout floors, a safety property on the
      # control screen. That is a deliberate migration, not a weekly update.
      # Raise this bound in the same commit that raises compileSdk.
      - dependency-name: "androidx.core:core"
        versions: [">1.16.0"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">1.16.0"]
      # Kotlin is bounded by the R8 that ships inside AGP, not by anything in
      # this project. AGP 8.13.2 carries R8 8.13.23, which cannot parse metadata
      # from Kotlin 2.4 or newer: it prints "An error occurred when parsing
      # kotlin metadata" and then shrinks WITHOUT Kotlin awareness, silently, in
      # the release build only. On an app whose R8 keep rules exist to stop a
      # stripped Tink key manager breaking the token store, that is not a
      # warning to live with.
      #
      # Measured on this project, not taken from a table -- assembleRelease,
      # counting the warning:
      #     2.2.20 -> 0    2.3.21 -> 0    2.4.0 -> 8    2.4.20 -> 8
      # Raise this bound in the same commit that raises AGP to 9.x.
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: [">=2.4.0"]
      - dependency-name: "org.jetbrains.kotlin.*"
        versions: [">=2.4.0"]

  - package-ecosystem: npm
    directory: /sk-plugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      all-npm:
        patterns: ["*"]
    ignore:
      # React, Vite and Vitest majors change test and build behaviour that the
      # plugin's suites depend on.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns: ["*"]
