org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# Required, not optional: every UI dependency :app declares is AndroidX
# (Compose, activity, lifecycle, datastore, security-crypto). Without this flag
# AGP refuses the build at :app:checkDebugAarMetadata rather than silently
# mixing the old support library in.
android.useAndroidX=true
